<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bonjour QR Code</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      background: #0a0a09;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,223,0,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: linear-gradient(160deg, #181816, #0e0e0c);
      border: 1.5px solid rgba(255,223,0,0.3);
      border-radius: 32px;
      padding: 36px 28px 32px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(255,223,0,0.1);
      position: relative;
      z-index: 1;
      animation: fadeUp 0.5s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .logo-wrap {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 16px;
    }
    .logo-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 60%, rgba(255,223,0,0.6) 100%);
      animation: spin 6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .logo-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid rgba(255,223,0,0.5);
      background: #1a1a10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      position: relative;
      z-index: 2;
      overflow: hidden;
    }
    .logo-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    .brand-name {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 12px rgba(255,223,0,0.4);
      margin-bottom: 4px;
    }
    .brand-line {
      width: 50px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffdf00, transparent);
      margin: 0 auto 20px;
    }

    /* QR Box */
    .qr-box {
      background: white;
      border-radius: 20px;
      padding: 14px;
      display: inline-block;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(255,223,0,0.25);
      border: 3px solid rgba(255,223,0,0.4);
    }
    #qrcode canvas,
    #qrcode img {
      display: block;
      border-radius: 8px;
    }

    .scan-text {
      font-size: 15px;
      font-weight: 700;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }
    .scan-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    /* Buttons */
    .btn-row { display: flex; gap: 10px; }

    .btn-download {
      flex: 1;
      padding: 13px;
      background: linear-gradient(135deg, #ffdf00, #c9a800);
      border: none;
      border-radius: 14px;
      color: #000;
      font-family: 'Cairo';
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform .15s;
    }
    .btn-download:active { transform: scale(0.96); }

    .btn-print {
      padding: 13px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      color: rgba(255,255,255,0.7);
      font-family: 'Cairo';
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform .15s;
    }
    .btn-print:active { transform: scale(0.96); }

    /* URL chip */
    .url-chip {
      margin-top: 16px;
      background: rgba(255,223,0,0.07);
      border: 1px solid rgba(255,223,0,0.2);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 11px;
      color: rgba(255,223,0,0.6);
      word-break: break-all;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Logo -->
  <div class="logo-wrap">
    <div class="logo-ring"></div>
    <div class="logo-circle">
      <img src="6028237241802493099_121.jpg" alt="Bonjour"
           onerror="this.style.display='none';this.parentElement.innerHTML='☕'">
    </div>
  </div>

  <div class="brand-name">Bonjour</div>
  <div class="brand-line"></div>

  <!-- QR -->
  <div class="qr-box">
    <div id="qrcode"></div>
  </div>

  <p class="scan-text">📱 امسح الكود لفتح المنيو</p>
  <p class="scan-sub">وجّه كاميرا موبايلك على الكود<br>للوصول لمنيو بونجور مباشرة</p>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn-download" onclick="downloadQR()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
      </svg>
      تحميل
    </button>
    <button class="btn-print" onclick="window.print()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
      </svg>
      طباعة
    </button>
  </div>

  <div class="url-chip" id="url-display"></div>

</div>

<script>
   const menuUrl = " https://aa-codes275.github.io/Bonjour_menu/";

  document.getElementById('url-display').textContent = menuUrl;

  const qr = new QRCode(document.getElementById("qrcode"), {
    text: menuUrl,
    width: 220,
    height: 220,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });

  function downloadQR() {
    setTimeout(() => {
      const canvas = document.querySelector('#qrcode canvas');
      if (!canvas) { alert('انتظر لحظة وحاول تاني'); return; }

      const link = document.createElement('a');
      link.download = 'bonjour-qr.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }, 300);
  }
</script>

</body>
</html>
